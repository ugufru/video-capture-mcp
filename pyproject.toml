[project]
name = "video-capture-mcp"
version = "0.1.0"
description = "MCP server for camera capture, OCR, and image comparison"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",
    "pytesseract>=0.3.10",
    "scikit-image>=0.21.0",
]

[project.scripts]
video-capture-mcp = "video_capture_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video_capture_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
