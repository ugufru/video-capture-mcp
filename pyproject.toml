[project]
name = "video-capture-mcp"
version = "2.0.0"
description = "Cross-platform MCP server for camera photo and video capture"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "opencv-python-headless>=4.8.0",
    "Pillow>=10.0.0",
]

[project.scripts]
video-capture-mcp = "video_capture_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video_capture_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
